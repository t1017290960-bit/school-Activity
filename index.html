const uniqueDates=[...new Set(BASE.map(x=>x.date))].sort();let activities=[],today=hkToday(),mode='today',scrolling=false,raf=0,pause=0,direction=1,last=0,pos=0;
function hkToday(){const a=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());let g=t=>a.find(x=>x.type===t).value;return `${g('year')}-${g('month')}-${g('day')}`}
function toast(t,ok=true){let e=document.getElementById('toast');e.textContent=t;e.className=`absolute bottom-14 left-1/2 -translate-x-1/2 text-white text-xs px-3 py-2 rounded-lg ${ok?'bg-emerald-600':'bg-rose-600'}`;setTimeout(()=>e.classList.add('hidden'),2800)}
async function persist(){let local=false;try{let s=JSON.stringify(activities);if(window.sayoStorage)await window.sayoStorage.setItem('daily_activities',s);else localStorage.setItem('daily_activities',s);local=true}catch(e){console.error(e)}if(window.sayoDb){try{let author=await window.sayoDb.getUserId();let r=await window.sayoDb.append('activity_schedule_records',{id:'sync-'+Date.now(),dataJson:JSON.stringify(activities),authorUserId:author,updatedAt:new Date().toISOString()});if(r?.ok)toast('已儲存並同步');else toast(local?'本機已儲存；雲端同步失敗':'儲存失敗',false)}catch(e){console.error(e);toast(local?'本機已儲存；雲端同步失敗':'儲存失敗',false)}}else toast(local?'已儲存在本機':'儲存失敗',local)}
async function init(){document.getElementById('datepick').value=today;let loaded=false;try{if(window.sayoDb){let rs=await window.sayoDb.getAll('activity_schedule_records');if(rs.length){rs.sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0));activities=JSON.parse(rs[0].dataJson||'[]');loaded=true}}if(!loaded){let s=window.sayoStorage?await window.sayoStorage.getItem('daily_activities'):localStorage.getItem('daily_activities');if(s){activities=JSON.parse(s);loaded=true}}}catch(e){console.error('Load error',e)}const before=JSON.stringify(activities);activities=activities.filter(a=>!String(a.date||'').startsWith('2026-09-')&&!String(a.id||'').startsWith('oct-'));const keys=new Set(activities.map(a=>a.date+'-'+a.name));activities.push(...BASE.filter(a=>!keys.has(a.date+'-'+a.name)));if(!loaded||JSON.stringify(activities)!==before)await persist();buildDates();render();startScroll()}
function buildDates(){let box=document.getElementById('dates');box.replaceChildren();let wd=['日','一','二','三','四','五','六'];uniqueDates.forEach(d=>{let b=document.createElement('button');b.type='button';b.dataset.date=d;b.className='date-btn shrink-0 px-2 py-0.5 rounded-full border border-slate-200 text-slate-600 text-xs';b.textContent=`10/${+d.slice(-2)} (${wd[new Date(d+'T12:00:00').getDay()]})`;b.onclick=()=>chooseDate(d);box.appendChild(b)});markDates()}
function markDates(){document.querySelectorAll('.date-btn').forEach(b=>b.className=`date-btn shrink-0 px-2 py-0.5 rounded-full border text-xs ${b.dataset.date===today?'bg-blue-50 text-blue-600 border-blue-200 font-semibold':'border-slate-200 text-slate-600'}`)}
function chooseDate(d){today=d;document.getElementById('datepick').value=d;markDates();if(mode==='all')setMode('today');else render()}
function setMode(m){mode=m;document.getElementById('allbtn').className='px-2 py-1 rounded '+(m==='all'?'bg-blue-600 text-white':'');document.getElementById('todaybtn').className='px-2 py-1 rounded '+(m==='today'?'bg-blue-600 text-white':'');render()}
function render(){let box=document.getElementById('list');box.replaceChildren();let arr=activities.filter(a=>mode==='all'||a.date===today).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.startTime||'').localeCompare(b.startTime||''));document.getElementById('count').textContent=`共 ${arr.length} 項`;if(!arr.length){let p=document.createElement('p');p.className='text-center text-slate-400 py-12';p.textContent='此日期暫無活動';box.append(p);return}arr.forEach(a=>{let row=document.createElement('div');row.className='flex gap-3 items-stretch min-h-[94px] cursor-pointer';row.onclick=()=>editItem(a.id);let dot=document.createElement('div');dot.className='mt-4 ml-1 w-3.5 h-3.5 rounded-full ring-4 shrink-0 '+(a.category==='活動'?'bg-amber-500 ring-amber-100':'bg-teal-600 ring-teal-100');let card=document.createElement('div');card.className='flex flex-1 overflow-hidden bg-white border border-slate-200 rounded-xl shadow-sm';let content=document.createElement('div');content.className='p-3 flex-1';let top=document.createElement('div');top.className='flex gap-3';let time=document.createElement('div');time.className='w-12 shrink-0 font-mono';let st=document.createElement('div');st.className='text-sm font-bold';st.textContent=a.startTime||'15:25';let en=document.createElement('div');en.className='text-[11px] text-slate-400 mt-1';en.textContent=a.endTime||'16:30';time.append(st,en);let info=document.createElement('div');info.className='min-w-0 flex-1';let title=document.createElement('div');title.className='font-bold text-base leading-snug';title.textContent=a.name||'';info.append(title);let details=document.createElement('div');details.className='mt-2 flex flex-wrap gap-2 text-xs text-slate-500';let room=document.createElement('span');room.className='bg-slate-50 px-2 py-0.5 rounded border';room.textContent='📍 '+(a.room||'課室');let date=document.createElement('span');date.textContent=mode==='all'?a.date:'';details.append(room,date);info.append(details);top.append(time,info);content.appe function toggleScroll(){scrolling?stopScroll():startScroll()}function startScroll(){let box=document.getElementById('list');scrolling=true;document.getElementById('scrollbtn').className='px-2 py-1 rounded bg-amber-500 text-white';document.getElementById('scrollicon').className='fa fa-pause';document.getElementById('scrolltext').textContent='暫停滾動';pos=box.scrollTop;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(step)}function step(t){if(!scrolling)return;let el=document.getElementById('list'),max=el.scrollHeight-el.clientHeight;if(max<=0){raf=requestAnimationFrame(step);return}let dt=Math.min(t-last,50);last=t;pos+=direction*32*dt/1000;if(pos>=max){pos=max;direction=-1;el.scrollTop=pos;pause=setTimeout(()=>{last=performance.now();raf=requestAnimationFrame(step)},1400);return}if(pos<=0){pos=0;direction=1;el.scrollTop=0;pause=setTimeout(()=>{last=performance.now();raf=requestAnimationFrame(step)},1400);return}el.scrollTop=pos;raf=requestAnimationFrame(step)}function stopScroll(){scrolling=false;cancelAnimationFrame(raf);clearTimeout(pause);document.getElementById('scrollbtn').className='px-2 py-1 rounded bg-amber-50 text-amber-700 border';document.getElementById('scrollicon').className='fa fa-play';document.getElementById('scrolltext').textContent='自動上下滾動'}
function showModal(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex')}function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex')}function fillForm(a){document.getElementById('eid').value=a?.id||'';document.getElementById('ename').value=a?.name||'';document.getElementById('estart').value=a?.startTime||'15:25';document.getElementById('eend').value=a?.endTime||'16:30';document.getElementById('eroom').value=a?.room||'';document.getElementById('ecat').value=a?.category||'學會';document.getElementById('edate').value=a?.date||today;document.getElementById('modtitle').textContent=a?'編輯活動資料':'新增課外活動';document.getElementById('delbtn').classList.toggle('hidden',!a);showModal()}function addItem(){fillForm(null)}function editItem(id){let a=activities.find(x=>x.id===id);if(a)fillForm(a)}async function saveItem(e){e.preventDefault();let id=document.getElementById('eid').value,a={id:id||'custom-'+Date.now(),name:document.getElementById('ename').value.trim(),startTime:document.getElementById('estart').value,endTime:document.getElementById('eend').value,room:document.getElementById('eroom').value.trim()||'課室',category:document.getElementById('ecat').value,date:document.getElementById('edate').value||today};let i=activities.findIndex(x=>x.id===id);if(i<0)activities.push(a);else activities[i]=a;await persist();render();closeModal()}async function deleteItem(){let id=document.getElementById('eid').value;if(!id||!confirm('確定刪除此活動？'))return;activities=activities.filter(a=>a.id!==id);await persist();render();closeModal()}async function resetData(){if(!confirm('確定重設為月曆中的10月活動？'))return;activities=[...BASE];await persist();render()}window.addEventListener('DOMContentLoaded',init);
