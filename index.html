<!DOCTYPE html>
<html lang="zh-HK">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>每日課外活動日程</title>
  
  <script type="application/json" id="sayo-db-schema">
  {
    "collections": [
      {
        "name": "activity_schedule_records",
        "label": "Daily Activity Records",
        "fields": ["id", "dataJson", "authorUserId", "updatedAt"]

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen text-slate-800 antialiased selection:bg-teal-100 p-0 sm:p-4">

  <!-- Main View Card Container (Exact Match to Picture) -->
  <div class="w-full max-w-md sm:max-w-lg bg-white min-h-screen sm:min-h-0 sm:h-[94vh] sm:rounded-2xl shadow-xl flex flex-col overflow-hidden border border-slate-200/80 relative">
    
    <!-- Header Bar -->
    <header class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-white sticky top-0 z-20">
      <div class="flex items-center space-x-2.5">
        <i class="fa-regular fa-calendar-days text-[#009b9e] text-xl"></i>
        <h1 class="text-lg font-bold tracking-tight text-slate-800">每日課外活動</h1>
        <span id="activity-count-badge" class="text-xs bg-[#e6f7f7] text-[#009b9e] font-semibold px-2.5 py-0.5 rounded-full border border-teal-200">
          共 14 項
        </span>
      </div>

      <div class="flex items-center space-x-1">
        <button onclick="openAddItemModal()" title="新增活動" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-teal-600 hover:bg-slate-100 transition text-sm">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="resetToDefaultData()" title="重設預設日程" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition text-sm">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </header>

    <!-- Sub-header Control Strip: Date & Scroll / Filter Controls -->
    <div class="px-4 py-2.5 bg-slate-50/80 border-b border-slate-100 flex flex-col gap-2 select-none">
      <div class="flex items-center justify-between gap-2">
        <!-- Date Picker Trigger -->
        <div class="flex items-center space-x-2 font-bold text-slate-800 relative group cursor-pointer">
          <i class="fa-regular fa-calendar text-[#267fe8] text-base"></i>
          <input type="date" id="date-input" value="2026-09-22" onchange="onDateChanged(this.value)" class="font-bold text-slate-800 bg-transparent text-sm sm:text-base outline-none cursor-pointer">
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center space-x-1.5 text-xs font-medium">
          <!-- Auto Scroll Button -->
          <button id="autoscroll-btn" onclick="toggleAutoScroll()" class="px-2.5 py-1 rounded-md font-medium bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition flex items-center gap-1 shadow-2xs">
            <i id="autoscroll-icon" class="fa-solid fa-play text-[9px] text-amber-600"></i>
            <span id="autoscroll-text">自動上下滾動</span>
          </button>

          <!-- View All vs Today Filter -->
          <button id="filter-all-btn" onclick="setFilterMode('all')" class="px-2.5 py-1 rounded-md text-slate-600 hover:bg-slate-200 transition">
            顯示全部
          </button>
          <button id="filter-today-btn" onclick="setFilterMode('today')" class="px-2.5 py-1 rounded-md bg-[#267fe8] text-white shadow-xs transition">
            本日活動
          </button>
        </div>
      </div>

      <!-- Quick Date Select Shortcut Pills -->
      <div class="flex items-center space-x-1.5 overflow-x-auto custom-scrollbar pb-1 text-xs">
        <button onclick="quickSelectDate('2026-09-14')" class="quick-date-btn px-2 py-0.5 rounded-full transition whitespace-nowrap border border-slate-200 text-slate-600 hover:bg-slate-100" data-date="2026-09-14">9/14 (一)</button>
        <button onclick="quickSelectDate('2026-09-15')" class="quick-date-btn px-2 py-0.5 rounded-full transition whitespace-nowrap border border-slate-200 text-slate-600 hover:bg-slate-100" data-date="2026-09-15">9/15 (二)</button>
        <button onclick="quickSelectDate('2026-09-16')" class="quick-date-btn px-2 py-0.5 rounded-full transition whitespace-nowrap border border-slate-200 text-slate-600 hover:bg-slate-100" data-date="2026-09-16">9/16 (三)</button>
        <button onclick="quickSelectDate('2026-09-17')" class="quick-date-btn px-2 py-0.5 rounded-full transition whitespace-nowrap border border-slate-200 text-slate-600 hover:bg-slate-100" data-date="2026-09-17">9/17 (四)</button>
        <button onclick="quickSelectDate('2026-09-18')" class="quick-date-btn px-2 py-0.5 rounded-full transition whitespace-nowrap border border-slate-200 text-slate-600 hover:bg-slate-100" data-date="2026-09-18">9/18 (五)</button>
        <button onclick="quickSelectDate('2026-09-21')" class="quick-date-btn px-2 py-0.5 rounded-full transition whitespace-nowrap border border-slate-200 text-slate-600 hover:bg-slate-100" data-date="2026-09-21">9/21 (一)</button>

    </main>

  <!-- Modal: View / Edit Activity Detail -->
  <div id="item-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden backdrop-blur-[2px]">
    <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col border border-slate-100 animate-in fade-in duration-150">
      <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/70">
        <h3 id="modal-title" class="text-base font-bold text-slate-800">活動資料</h3>
        <button onclick="closeItemModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="item-form" onsubmit="saveActivity(event)" class="p-5 space-y-3 text-xs">
        <input type="hidden" id="edit-id">

        <div>
          <label class="block text-slate-600 font-medium mb-1">活動名稱</label>
          <input type="text" id="edit-name" required class="w-full p-2 border border-slate-200 rounded-lg text-sm font-semibold outline-none focus:border-[#009b9e]">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-600 font-medium mb-1">開始時間</label>
            <input type="time" id="edit-start" required class="w-full p-2 border border-slate-200 rounded-lg text-sm font-mono outline-none">
          </div>
          <div>
            <label class="block text-slate-600 font-medium mb-1">結束時間</label>
            <input type="time" id="edit-end" required class="w-full p-2 border border-slate-200 rounded-lg text-sm font-mono outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-600 font-medium mb-1">地點 / 課室</label>
            <input type="text" id="edit-room" placeholder="例如: 601" class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none">
          </div>
          <div>
            <label class="block text-slate-600 font-medium mb-1">分類標籤</label>
            <select id="edit-category" class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none bg-white font-medium">
              <option value="學會">學會 (青綠色條)</option>
              <option value="活動">活動 (黃橙色條)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-600 font-medium mb-1">所屬日期</label>
          <input type="date" id="edit-date" class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none bg-white">
        </div>

        <div class="pt-3 flex space-x-2">
          <button type="button" onclick="deleteCurrentActivity()" id="delete-btn" class="px-3.5 py-2 text-rose-500 hover:bg-rose-50 rounded-lg transition border border-rose-200 font-medium">
            刪除
          </button>
          <button type="submit" class="flex-1 py-2 bg-[#009b9e] text-white rounded-lg font-bold hover:bg-teal-700 transition shadow-xs text-sm">
            儲存活動
          </button>
        </div>
      </form>
    </div>
  </div>

    function parseCalendar(text) {
      const lines = text.split('\n');
      let curDate = '';
      const list = [];
      let c = 1;

      for (let raw of lines) {
        const l = raw.trim();
        if (!l) continue;
        if (/^\d{4}-\d{2}-\d{2}$/.test(l)) {
          curDate = l;
          continue;
        }
        if (!curDate) continue;

        const m = l.match(/^(\d{1,2}:\d{2})\s*[-~至到]\s*(\d{1,2}:\d{2})\s+(.+)$/);
        if (m) {
          const startTime = m[1].padStart(5, '0');
          const endTime = m[2].padStart(5, '0');
          const rest = m[3].trim();

          let name = rest;
          let room = "課室";
          const rm = rest.match(/^(.*?)(?:\s*\(([^()]+)\))$/);
          if (rm) {
            name = rm[1].trim();
            room = rm[2].trim();
          }

          const isAct = /(隊|校隊|合唱團|鼓|樂隊|樂動|童軍|紅十字|跳繩|舞|拔尖|Band|精兵|Ambassador|小先鋒|表演生)/i.test(name);

          list.push({
            id: `cal-${curDate}-${c++}`,
            date: curDate,
            name: name,
            startTime: startTime,
            endTime: endTime,
            room: room,
            category: isAct ? "活動" : "學會"
          });
        }
      }
      return list;
    }

    const INITIAL_ACTIVITIES = parseCalendar(RAW_CALENDAR_TEXT);

    let activities = [];
    let currentDate = "2026-09-22";
    let filterMode = "today"; // 'today' or 'all'

    // Auto-scroll variables
    let isAutoScrolling = false;
    let autoScrollInterval = null;
    let scrollDirection = "down";
    let scrollPauseTimer = null;

    async function init() {
      // 1. Load from platform database if exists
      let loaded = false;
      if (window.sayoDb && typeof window.sayoDb.getAll === 'function') {
        try {
          const records = await window.sayoDb.getAll("activity_schedule_records");
          if (Array.isArray(records) && records.length > 0) {
            records.sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
            if (records[0]?.dataJson) {
              activities = JSON.parse(records[0].dataJson);
              loaded = true;
            }
          }
        } catch (e) {
          console.warn("DB load error:", e);
        }
      }

      // 2. Fallback to Local Storage or Defaults (Auto merge calendar dates)
      if (!loaded) {
        try {
          const stored = window.sayoStorage 
            ? await window.sayoStorage.getItem("daily_activities") 
            : localStorage.getItem("daily_activities");
          if (stored) {
            const parsed = JSON.parse(stored);
            // Merge missing dates from calendar if any
            const existingKeys = new Set(parsed.map(a => `${a.date}-${a.name}`));
            const missing = INITIAL_ACTIVITIES.filter(a => !existingKeys.has(`${a.date}-${a.name}`));
            activities = missing.length > 0 ? [...parsed, ...missing] : parsed;
          } else {
            activities = [...INITIAL_ACTIVITIES];
          }
          await persistData();
        } catch (e) {
          activities = [...INITIAL_ACTIVITIES];
        }
      } else {
        // Merge missing calendar dates into DB data
        const existingKeys = new Set(activities.map(a => `${a.date}-${a.name}`));
        const missing = INITIAL_ACTIVITIES.filter(a => !existingKeys.has(`${a.date}-${a.name}`));
        if (missing.length > 0) {
          activities = [...activities, ...missing];
          await persistData();
        }
      }

      render();
    }

    async function persistData() {
      // Save locally
      try {
        const str = JSON.stringify(activities);
        if (window.sayoStorage) {
          await window.sayoStorage.setItem("daily_activities", str);
        } else {
          localStorage.setItem("daily_activities", str);
        }
      } catch (e) {}

      // Save to platform database for teacher review / cross-device sync
      if (window.sayoDb && typeof window.sayoDb.append === 'function') {
        try {
          let authorId = "teacher";
          if (typeof window.sayoDb.getUserId === 'function') {
            try { authorId = await window.sayoDb.getUserId(); } catch (e) {}
          }
          await window.sayoDb.append("activity_schedule_records", {
            id: 'sync-' + Date.now(),
            dataJson: JSON.stringify(activities),
            authorUserId: authorId,
            updatedAt: new Date().toISOString()
          });
        } catch (e) {
          console.warn("Cloud save note:", e);
        }
      }
    }

    function render() {
      const container = document.getElementById('activity-container');
      const badge = document.getElementById('activity-count-badge');

      let filtered = [];
      if (filterMode === "today") {
        filtered = activities.filter(a => a.date === currentDate);
      } else {
        filtered = [...activities];
      }

      // Sort by start time ascending
      filtered.sort((a, b) => (a.startTime || "00:00").localeCompare(b.startTime || "00:00"));

      badge.textContent = `共 ${filtered.length} 項`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-slate-400 text-sm">
            <i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-300"></i>
            <p>此日期暫無活動記錄</p>
            <button onclick="openAddItemModal()" class="mt-3 text-xs text-[#009b9e] font-medium bg-teal-50 px-3 py-1.5 rounded-lg border border-teal-200 hover:bg-teal-100 transition">
              + 新增本日活動
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((item, index) => {
        const isClub = item.category === "學會" || !item.category;
        const barColor = isClub ? 'bg-[#009b9e]' : 'bg-amber-500';
        const dotColor = isClub ? 'bg-[#009b9e] ring-teal-100' : 'bg-amber-500 ring-amber-100';

        return `
          <div onclick="openEditItemModal('${item.id}')" class="flex items-stretch space-x-3.5 relative cursor-pointer group">
            
            <!-- Left Vertical Timeline Indicator -->
            <div class="flex flex-col items-center pt-3.5 pl-0.5">
              <div class="w-3.5 h-3.5 rounded-full ${dotColor} ring-4 z-10 transition-transform group-hover:scale-110 shadow-2xs"></div>
              <div class="w-0.5 bg-slate-200 flex-1 -mt-1 -mb-1"></div>
            </div>

            <!-- Main White Card -->
            <div class="flex-1 bg-white border border-slate-200/80 rounded-xl shadow-[0_1px_3px_rgba(0,0,0,0.03)] hover:shadow-md hover:border-teal-300 transition-all flex overflow-hidden">
              <div class="p-3.5 sm:p-4 flex-1 flex flex-col justify-between">
                
                <div class="flex items-start space-x-4">
                  <!-- Start & End Time Box -->
                  <div class="text-sm sm:text-base font-bold text-slate-800 font-mono leading-tight whitespace-nowrap pt-0.5 text-center min-w-[50px]">
                    <div>${escapeHtml(item.startTime || '15:25')}</div>
                    <div class="text-slate-400 text-xs font-normal mt-0.5">${escapeHtml(item.endTime || '16:30')}</div>
                  </div>

                  <!-- Title & Badges -->
                  <div class="flex-1 min-w-0">
                    <h3 class="text-base sm:text-[17px] font-bold text-slate-800 leading-snug group-hover:text-[#009b9e] transition truncate">
                      ${escapeHtml(item.name)}
                    </h3>

                    <!-- Details Row -->
                    <div class="flex flex-wrap items-center gap-2 text-xs font-medium text-slate-500 mt-2">
                      <span class="inline-flex items-center gap-1 text-slate-700 bg-slate-50 px-2.5 py-0.5 rounded-md border border-slate-200/90 font-mono">
                        <i class="fa-solid fa-location-dot text-[#009b9e] text-xs"></i>
                        <span>${escapeHtml(item.room || '課室')}</span>
                      </span>

                      <span class="inline-flex items-center gap-1 text-slate-400 font-normal font-mono">
                        <i class="fa-regular fa-clock text-[11px]"></i>
                        <span>${escapeHtml(item.startTime)} - ${escapeHtml(item.endTime)}</span>
                      </span>

                      ${filterMode === 'all' && item.date ? `<span class="text-blue-500 font-mono text-[11px] bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100">${item.date}</span>` : ''}
                    </div>
                  </div>
                </div>

              </div>

              <!-- Right Vertical Colored Border Indicator -->
              <div class="w-2.5 ${barColor} shrink-0 self-stretch rounded-r-xl"></div>
            </div>

          </div>
        `;
      }).join('');
    }

    function onDateChanged(newDate) {
      currentDate = newDate;
      updateQuickDatePills(newDate);
      if (filterMode === 'all') {
        setFilterMode('today');
      } else {
        render();
      }
    }

    function quickSelectDate(dateStr) {
      const picker = document.getElementById('date-input');
      if (picker) picker.value = dateStr;
      onDateChanged(dateStr);
    }

    function updateQuickDatePills(activeDate) {
      document.querySelectorAll('.quick-date-btn').forEach(btn => {
        if (btn.getAttribute('data-date') === activeDate) {
          btn.className = "quick-date-btn px-2 py-0.5 rounded-full transition whitespace-nowrap bg-blue-50 text-[#267fe8] font-semibold border border-blue-200 shadow-2xs";
        } else {
          btn.className = "quick-date-btn px-2 py-0.5 rounded-full transition whitespace-nowrap border border-slate-200 text-slate-600 hover:bg-slate-100";
        }
      });
    }

    function setFilterMode(mode) {
      filterMode = mode;
      const todayBtn = document.getElementById('filter-today-btn');
      const allBtn = document.getElementById('filter-all-btn');

      if (mode === 'all') {
        allBtn.className = "px-2.5 py-1 rounded-md bg-[#267fe8] text-white shadow-xs transition";
        todayBtn.className = "px-2.5 py-1 rounded-md text-slate-600 hover:bg-slate-200 transition";
      } else {
        todayBtn.className = "px-2.5 py-1 rounded-md bg-[#267fe8] text-white shadow-xs transition";
        allBtn.className = "px-2.5 py-1 rounded-md text-slate-600 hover:bg-slate-200 transition";
      }
      render();
    }

    // Auto-scroll loop
    function toggleAutoScroll() {
      if (isAutoScrolling) {
        stopAutoScroll();
      } else {
        startAutoScroll();
      }
    }

    function startAutoScroll() {
      const container = document.getElementById('activity-container');
      if (!container) return;
      isAutoScrolling = true;
      scrollDirection = 'down';

      const btn = document.getElementById('autoscroll-btn');
      const icon = document.getElementById('autoscroll-icon');
      const text = document.getElementById('autoscroll-text');
      
      if (btn) {
        btn.className = "px-2.5 py-1 rounded-md font-medium bg-amber-500 text-white shadow-xs transition flex items-center gap-1 animate-pulse";
      }
      if (icon) icon.className = "fa-solid fa-pause text-[9px]";
      if (text) text.textContent = "暫停滾動";

      runAutoScrollStep();
    }

    function runAutoScrollStep() {
      clearInterval(autoScrollInterval);
      clearTimeout(scrollPauseTimer);

      const container = document.getElementById('activity-container');
      if (!container) return;

      autoScrollInterval = setInterval(() => {
        if (!isAutoScrolling || !container) return;

        const maxScroll = container.scrollHeight - container.clientHeight;
        if (maxScroll <= 0) return;

        const speed = 1.3;

        if (scrollDirection === 'down') {
          if (container.scrollTop >= maxScroll - 2) {
            clearInterval(autoScrollInterval);
            scrollPauseTimer = setTimeout(() => {
              if (!isAutoScrolling) return;
              scrollDirection = 'up';
              runAutoScrollStep();
            }, 1800);
          } else {
            container.scrollTop += speed;
          }
        } else {
          if (container.scrollTop <= 2) {
            clearInterval(autoScrollInterval);
            scrollPauseTimer = setTimeout(() => {
              if (!isAutoScrolling) return;
              scrollDirection = 'down';
              runAutoScrollStep();
            }, 1800);
          } else {
            container.scrollTop -= speed;
          }
        }
      }, 25);
    }

    function stopAutoScroll() {
      isAutoScrolling = false;
      clearInterval(autoScrollInterval);
      clearTimeout(scrollPauseTimer);
      autoScrollInterval = null;
      scrollPauseTimer = null;

      const btn = document.getElementById('autoscroll-btn');
      const icon = document.getElementById('autoscroll-icon');
      const text = document.getElementById('autoscroll-text');
      
      if (btn) {
        btn.className = "px-2.5 py-1 rounded-md font-medium bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition flex items-center gap-1 shadow-2xs";
      }
      if (icon) icon.className = "fa-solid fa-play text-[9px] text-amber-600";
      if (text) text.textContent = "自動上下滾動";
    }

    // Modal Operations
    function openAddItemModal() {
      document.getElementById('modal-title').textContent = "新增課外活動";
      document.getElementById('edit-id').value = "";
      document.getElementById('edit-name').value = "";
      document.getElementById('edit-start').value = "15:25";
      document.getElementById('edit-end').value = "16:30";
      document.getElementById('edit-room').value = "601";
      document.getElementById('edit-category').value = "學會";
      document.getElementById('edit-date').value = currentDate;
      document.getElementById('delete-btn').classList.add('hidden');

      document.getElementById('item-modal').classList.remove('hidden');
    }

    function openEditItemModal(id) {
      const item = activities.find(a => a.id === id);
      if (!item) return;

      document.getElementById('modal-title').textContent = "編輯活動資料";
      document.getElementById('edit-id').value = item.id;
      document.getElementById('edit-name').value = item.name;
      document.getElementById('edit-start').value = item.startTime;
      document.getElementById('edit-end').value = item.endTime;
      document.getElementById('edit-room').value = item.room || "";
      document.getElementById('edit-category').value = item.category || "學會";
      document.getElementById('edit-date').value = item.date || currentDate;
      document.getElementById('delete-btn').classList.remove('hidden');

      document.getElementById('item-modal').classList.remove('hidden');
    }

    function closeItemModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    async function saveActivity(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value.trim();
      const startTime = document.getElementById('edit-start').value;
      const endTime = document.getElementById('edit-end').value;
      const room = document.getElementById('edit-room').value.trim() || "課室";
      const category = document.getElementById('edit-category').value;
      const date = document.getElementById('edit-date').value || currentDate;

      if (id) {
        const idx = activities.findIndex(a => a.id === id);
        if (idx !== -1) {
          activities[idx] = { ...activities[idx], name, startTime, endTime, room, category, date };
        }
      } else {
        activities.push({
          id: 'act-' + Date.now(),
          name,
          startTime,
          endTime,
          room,
          category,
          date
        });
      }

      await persistData();
      render();
      closeItemModal();
    }

    async function deleteCurrentActivity() {
      const id = document.getElementById('edit-id').value;
      if (!id) return;
      if (confirm("確定要刪除此活動項嗎？")) {
        activities = activities.filter(a => a.id !== id);
        await persistData();
        render();
        closeItemModal();
      }
    }

    async function resetToDefaultData() {
      if (confirm("確定重設為圖片中的 14 項活動日程？")) {
        activities = [...INITIAL_ACTIVITIES];
        currentDate = "2026-09-22";
        document.getElementById('date-input').value = currentDate;
        setFilterMode('today');
        await persistData();
        render();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
