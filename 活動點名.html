<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>eClass 活動點名系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js CDN for PDF import & text parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center min-h-screen text-slate-800 antialiased selection:bg-blue-100">

  <!-- Mobile Frame Container -->
  <div class="w-full max-w-md bg-white min-h-screen shadow-2xl flex flex-col relative pb-20 select-none">
    
    <!-- Top iOS-style status bar placeholder -->
    <div class="bg-[#267fe8] text-white pt-2 px-5 flex justify-between items-center text-xs font-semibold">
      <span id="current-time">3:18</span>
      <div class="flex items-center space-x-1.5 text-xs">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full text-sm"></i>
      </div>
    </div>

    <!-- Header Bar -->
    <header class="bg-[#267fe8] text-white px-3 py-2.5 flex items-center justify-between shadow-sm relative z-10">
      <button onclick="togglePage('menu')" class="flex items-center space-x-1 text-white hover:opacity-80 active:scale-95 transition text-base font-normal">
        <i class="fa-solid fa-chevron-left text-sm"></i>
        <span>更多</span>
      </button>

      <h1 class="text-lg font-medium tracking-wide">活動點名</h1>

      <div class="flex items-center space-x-2">
        <!-- PDF Import quick button -->
        <button onclick="openPdfModal()" title="匯入 PDF / 新增活動" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
          <i class="fa-solid fa-file-arrow-up text-base"></i>
        </button>
        <!-- Calendar Popup Trigger (Red circle in screenshot) -->
        <button onclick="openScheduleModal()" title="每日課外活動日程" class="w-8 h-8 rounded-full border border-white/40 flex items-center justify-center hover:bg-white/20 active:scale-90 transition shadow-inner">
          <i class="fa-regular fa-calendar-days text-base"></i>
        </button>
      </div>
    </header>

    <!-- Sub-header Segmented Tabs (學會 / 活動) -->
    <div class="bg-[#267fe8] px-4 pb-3">
      <div class="bg-black/15 p-0.5 rounded-lg flex text-sm">
        <button id="tab-club" onclick="setCategory('學會')" class="flex-1 py-1.5 rounded-md font-medium text-center transition bg-white text-[#267fe8] shadow-sm">
          學會
        </button>
        <button id="tab-act" onclick="setCategory('活動')" class="flex-1 py-1.5 rounded-md font-medium text-center transition text-white hover:text-white/90">
          活動
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col bg-white overflow-y-auto custom-scrollbar">

      <!-- Date Row -->
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between bg-white sticky top-0 z-10 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
        <div class="flex items-center space-x-2.5">
          <i class="fa-regular fa-calendar text-slate-500 text-lg"></i>
          <input type="date" id="date-picker" onchange="onDateChange(this.value)" class="text-slate-700 font-medium text-base outline-none bg-transparent cursor-pointer" value="2026-09-18">
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="openEditItemModal(null)" class="text-xs font-medium text-[#267fe8] bg-blue-50 px-2.5 py-1 rounded-full border border-blue-200 hover:bg-blue-100 transition flex items-center gap-1">
            <i class="fa-solid fa-plus text-[10px]"></i> 新增班別
          </button>
        </div>
      </div>

      <!-- Table Column Headers -->
      <div class="bg-[#009b9e] text-white px-4 py-2 flex items-center text-sm font-normal tracking-wide">
        <div class="w-7/12">名稱</div>
        <div class="w-3/12 text-center">人數</div>
        <div class="w-2/12 text-right pr-2">狀態</div>
      </div>

      <!-- Activity Items List -->
      <div id="activity-list" class="divide-y divide-slate-100">
        <!-- Injected via JS -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden flex-col items-center justify-center p-12 text-slate-400">
        <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
        <p class="text-sm">此日期暫無活動記錄</p>
        <button onclick="openPdfModal()" class="mt-3 text-xs text-[#267fe8] font-medium bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-200">
          匯入 PDF 課外活動表
        </button>
      </div>

    </main>

    <!-- Bottom Navigation Bar (Matching original eClass app) -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-white border-t border-slate-200 flex items-center justify-around px-2 z-20">
      <button class="flex flex-col items-center text-slate-400 hover:text-[#267fe8] text-xs space-y-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span>首頁</span>
      </button>
      <button class="flex flex-col items-center text-slate-400 hover:text-[#267fe8] text-xs space-y-1 relative">
        <span class="relative">
          <i class="fa-solid fa-comment-dots text-lg"></i>
          <span class="absolute -top-1 -right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
        </span>
        <span>即時訊息</span>
      </button>
      <button onclick="togglePage('attendance')" class="flex flex-col items-center text-[#267fe8] text-xs space-y-1">
        <i class="fa-solid fa-right-left text-lg"></i>
        <span class="font-medium">點名</span>
      </button>
      <button class="flex flex-col items-center text-slate-400 hover:text-[#267fe8] text-xs space-y-1">
        <i class="fa-regular fa-newspaper text-lg"></i>
        <span>職員通告</span>
      </button>
      <button onclick="togglePage('menu')" class="flex flex-col items-center text-slate-400 hover:text-[#267fe8] text-xs space-y-1 relative">
        <span class="relative">
          <i class="fa-solid fa-bars text-lg"></i>
          <span class="absolute -top-1 -right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
        </span>
        <span>更多</span>
      </button>
    </nav>

    <!-- ==================== POPUP 1: 每日課外活動 日程 (Screenshots 3) ==================== -->
    <div id="schedule-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-[2px] transition-opacity">
      <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[85vh] animate-in fade-in zoom-in-95 duration-200">
        
        <!-- Modal Header -->
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center space-x-2 text-slate-700">
            <i class="fa-regular fa-calendar-days text-[#009b9e] text-lg"></i>
            <h2 class="text-base font-bold tracking-tight">每日課外活動</h2>
          </div>
          <button onclick="closeScheduleModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <!-- Date selector inside modal -->
        <div class="px-5 py-2.5 bg-slate-50/80 border-b border-slate-100 flex items-center space-x-2 text-sm text-slate-600">
          <i class="fa-regular fa-calendar text-slate-400"></i>
          <span id="modal-date-label" class="font-medium">2026-09-18</span>
        </div>

        <!-- Timeline Activities Cards List -->
        <div id="timeline-list" class="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-4">
          <!-- Timeline items injected via JS -->
        </div>

        <!-- Footer Category Legend -->
        <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex items-center space-x-6 text-xs font-medium text-slate-600">
          <div class="flex items-center space-x-2">
            <span class="w-1.5 h-4 bg-[#009b9e] rounded-sm"></span>
            <span>學會</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-1.5 h-4 bg-amber-500 rounded-sm"></span>
            <span>活動</span>
          </div>
        </div>

      </div>
    </div>

    <!-- ==================== POPUP 2: PDF 匯入與文字解析器 ==================== -->
    <div id="pdf-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-[2px]">
      <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-blue-50/60">
          <div class="flex items-center space-x-2 text-[#267fe8]">
            <i class="fa-solid fa-file-pdf text-lg"></i>
            <h2 class="text-base font-bold">匯入 / 編輯活動資料</h2>
          </div>
          <button onclick="closePdfModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <div class="p-5 overflow-y-auto space-y-4 text-xs">
          <!-- PDF upload dropzone -->
          <div class="border-2 border-dashed border-blue-200 rounded-xl p-4 text-center bg-blue-50/30 hover:bg-blue-50/60 transition cursor-pointer" onclick="document.getElementById('pdf-file-input').click()">
            <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden" onchange="handlePdfUpload(event)">
            <i class="fa-solid fa-cloud-arrow-up text-2xl text-[#267fe8] mb-1.5"></i>
            <p class="font-medium text-slate-700 text-sm">選擇學校活動 PDF 檔案</p>
            <p class="text-slate-400 mt-1">自動解析活動名稱、時段、地點與人數</p>
            <span id="pdf-status-text" class="inline-block mt-2 font-mono text-[11px] text-blue-600 font-medium"></span>
          </div>

          <!-- Quick Text / JSON Paste Area -->
          <div>
            <label class="block font-semibold text-slate-700 mb-1">或直接貼上課外活動列表 (每行一筆)：</label>
            <textarea id="quick-text-input" rows="4" class="w-full text-xs p-2.5 border border-slate-200 rounded-lg outline-none focus:border-[#267fe8] font-mono leading-relaxed" placeholder="大小肌訓練班 (14:40 - 15:40) 8/8 402&#10;無火煮食初班 (14:40 - 15:40) 7/7 403"></textarea>
          </div>

          <div class="flex items-center justify-between text-slate-500">
            <span>預設分配分類：</span>
            <div class="flex space-x-2">
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="import-cat" value="學會" checked> <span>學會</span>
              </label>
              <label class="flex items-center space-x-1 cursor-pointer">
                <input type="radio" name="import-cat" value="活動"> <span>活動</span>
              </label>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="pt-2 flex gap-2">
            <button onclick="parseQuickTextInput()" class="flex-1 py-2.5 bg-[#267fe8] text-white rounded-lg font-medium hover:bg-blue-600 transition shadow-sm">
              匯入並套用
            </button>
            <button onclick="resetDefaultData()" class="px-3 py-2.5 bg-slate-100 text-slate-600 rounded-lg font-medium hover:bg-slate-200 transition">
              重設範例
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== POPUP 3: 單項活動編輯 / 點名狀態更改 ==================== -->
    <div id="edit-item-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-[2px]">
      <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
          <h3 id="edit-modal-title" class="text-base font-bold text-slate-800">編輯活動資料</h3>
          <button onclick="closeEditItemModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="edit-form" onsubmit="saveItem(event)" class="p-5 space-y-3 text-xs overflow-y-auto">
          <input type="hidden" id="item-id">
          
          <div>
            <label class="block text-slate-600 font-medium mb-1">活動名稱</label>
            <input type="text" id="item-name" required class="w-full p-2 border border-slate-200 rounded-lg text-sm font-medium outline-none focus:border-[#267fe8]">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-600 font-medium mb-1">開始時間</label>
              <input type="time" id="item-start-time" value="14:40" required class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none">
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">結束時間</label>
              <input type="time" id="item-end-time" value="15:40" required class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-600 font-medium mb-1">地點 / 課室</label>
              <input type="text" id="item-room" placeholder="例如: 403 / 禮堂" class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none">
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">分類</label>
              <select id="item-category" class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none bg-white">
                <option value="學會">學會</option>
                <option value="活動">活動</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-600 font-medium mb-1">已到 / 總人數</label>
              <div class="flex items-center space-x-1">
                <input type="number" id="item-present" min="0" class="w-full p-2 border border-slate-200 rounded-lg text-sm text-center" value="8">
                <span class="text-slate-400">/</span>
                <input type="number" id="item-total" min="1" class="w-full p-2 border border-slate-200 rounded-lg text-sm text-center" value="8">
              </div>
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">點名狀態</label>
              <select id="item-status" class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none bg-white">
                <option value="已點名">已點名 (綠色)</option>
                <option value="未點名">未點名 (灰色)</option>
                <option value="進行中">進行中</option>
              </select>
            </div>
          </div>

          <!-- Submit Buttons -->
          <div class="pt-3 flex space-x-2">
            <button type="button" onclick="deleteCurrentItem()" id="delete-btn" class="px-3 py-2 text-rose-500 hover:bg-rose-50 rounded-lg transition border border-rose-200 font-medium">
              刪除
            </button>
            <button type="submit" class="flex-1 py-2.5 bg-[#267fe8] text-white rounded-lg font-medium hover:bg-blue-600 transition shadow-sm text-sm">
              儲存更改
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ==================== POPUP 4: "更多" 選單頁 (Screenshot 1) ==================== -->
    <div id="menu-page" class="absolute inset-0 bg-[#f4f5f9] z-30 flex flex-col hidden overflow-y-auto">
      <div class="bg-[#267fe8] text-white pt-2 px-5 flex justify-between items-center text-xs font-semibold">
        <span>3:17</span>
        <div class="flex items-center space-x-1.5 text-xs">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-full text-sm"></i>
        </div>
      </div>
      <div class="bg-[#267fe8] text-white py-3 text-center text-lg font-medium shadow-sm">
        更多
      </div>

      <!-- Menu Items List -->
      <div class="bg-white divide-y divide-slate-100 text-sm mt-0 shadow-sm">
        
        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-amber-500 text-lg"><i class="fa-solid fa-bullhorn"></i></div>
            <span class="text-slate-800 text-base">學校宣布</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 bg-red-500 rounded-full"></span>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
          </div>
        </div>

        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-rose-500 text-lg"><i class="fa-regular fa-calendar-days"></i></div>
            <span class="text-slate-800 text-base">校曆表</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        </div>

        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-blue-500 text-lg"><i class="fa-solid fa-calendar-check"></i></div>
            <span class="text-slate-800 text-base">職員考勤</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        </div>

        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-orange-500 text-lg"><i class="fa-solid fa-file-lines"></i></div>
            <span class="text-slate-800 text-base">學生通告</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        </div>

        <!-- Highlighted Activity Attendance Item -->
        <div onclick="togglePage('attendance')" class="flex items-center justify-between px-4 py-3.5 bg-blue-50/50 hover:bg-blue-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-pink-500 text-lg"><i class="fa-solid fa-table-tennis-paddle-ball"></i></div>
            <span class="text-slate-900 font-medium text-base">活動點名</span>
          </div>
          <i class="fa-solid fa-chevron-right text-[#267fe8] text-xs"></i>
        </div>

        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-emerald-500 text-lg"><i class="fa-solid fa-clipboard-user"></i></div>
            <span class="text-slate-800 text-base">學生目錄</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        </div>

        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-yellow-500 text-lg"><i class="fa-solid fa-comments"></i></div>
            <span class="text-slate-800 text-base">小組訊息</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 bg-red-500 rounded-full"></span>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
          </div>
        </div>

        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-blue-400 text-lg"><i class="fa-solid fa-list-check"></i></div>
            <span class="text-slate-800 text-base">資產管理</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        </div>

        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition cursor-pointer">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-rose-400 text-lg"><i class="fa-solid fa-book-open"></i></div>
            <span class="text-slate-800 text-base">綜合圖書館</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        </div>

      </div>

      <!-- Bottom eClass info blocks -->
      <div class="bg-white divide-y divide-slate-100 text-sm mt-4 shadow-sm pb-16">
        <div class="flex items-center justify-between px-4 py-3.5">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-slate-600 text-lg"><i class="fa-regular fa-newspaper"></i></div>
            <span class="text-slate-800 text-base">eClass 電子報</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 bg-red-500 rounded-full"></span>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
          </div>
        </div>

        <div class="flex items-center justify-between px-4 py-3.5">
          <div class="flex items-center space-x-3.5">
            <div class="w-6 text-center text-slate-600 text-lg"><i class="fa-solid fa-desktop"></i></div>
            <span class="text-slate-800 text-base">eClass 新功能</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 bg-red-500 rounded-full"></span>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Javascript Logic -->
  <script>
    // Initial data structured directly from user's screenshots
    const DEFAULT_DATA = [
      {
        id: "act-1",
        date: "2026-09-18",
        name: "大小肌訓練班",
        category: "學會",
        timeRange: "14:40 - 15:40",
        startTime: "14:40",
        endTime: "15:40",
        room: "402",
        present: 8,
        total: 8,
        status: "已點名"
      },
      {
        id: "act-2",
        date: "2026-09-18",
        name: "小三小四英文讀寫基礎班",
        category: "學會",
        timeRange: "14:40 - 15:40",
        startTime: "14:40",
        endTime: "15:40",
        room: "405",
        present: 10,
        total: 10,
        status: "已點名"
      },
      {
        id: "act-3",
        date: "2026-09-18",
        name: "六色積木體應用與體驗訓練初班",
        category: "學會",
        timeRange: "14:40 - 15:40",
        startTime: "14:40",
        endTime: "15:40",
        room: "406",
        present: 5,
        total: 5,
        status: "已點名"
      },
      {
        id: "act-4",
        date: "2026-09-18",
        name: "高級組中國鼓",
        category: "活動",
        timeRange: "14:40 - 16:40",
        startTime: "14:40",
        endTime: "16:40",
        room: "大禮堂",
        present: 18,
        total: 18,
        status: "已點名"
      },
      {
        id: "act-5",
        date: "2026-09-18",
        name: "無火煮食初班",
        category: "學會",
        timeRange: "14:40 - 15:40",
        startTime: "14:40",
        endTime: "15:40",
        room: "403",
        present: 7,
        total: 7,
        status: "已點名"
      },
      {
        id: "act-6",
        date: "2026-09-18",
        name: "無火煮食進階班",
        category: "學會",
        timeRange: "14:40 - 15:40",
        startTime: "14:40",
        endTime: "15:40",
        room: "404",
        present: 8,
        total: 8,
        status: "已點名"
      }
    ];

    let activities = [];
    let currentCategory = "學會";
    let currentDate = "2026-09-18";

    // Initialize application & storage
    async function initApp() {
      try {
        if (window.sayoStorage) {
          const saved = await window.sayoStorage.getItem("eclass_activities_data");
          if (saved) {
            activities = JSON.parse(saved);
          } else {
            activities = [...DEFAULT_DATA];
            await window.sayoStorage.setItem("eclass_activities_data", JSON.stringify(activities));
          }
        } else {
          activities = [...DEFAULT_DATA];
        }
      } catch (err) {
        activities = [...DEFAULT_DATA];
      }
      renderList();
    }

    async function saveData() {
      if (window.sayoStorage) {
        try {
          await window.sayoStorage.setItem("eclass_activities_data", JSON.stringify(activities));
        } catch (e) {
          console.error("Storage error:", e);
        }
      }
    }

    // Toggle categories between "學會" and "活動"
    function setCategory(cat) {
      currentCategory = cat;
      const clubTab = document.getElementById('tab-club');
      const actTab = document.getElementById('tab-act');

      if (cat === "學會") {
        clubTab.className = "flex-1 py-1.5 rounded-md font-medium text-center transition bg-white text-[#267fe8] shadow-sm";
        actTab.className = "flex-1 py-1.5 rounded-md font-medium text-center transition text-white hover:text-white/90";
      } else {
        actTab.className = "flex-1 py-1.5 rounded-md font-medium text-center transition bg-white text-[#267fe8] shadow-sm";
        clubTab.className = "flex-1 py-1.5 rounded-md font-medium text-center transition text-white hover:text-white/90";
      }
      renderList();
    }

    function onDateChange(val) {
      currentDate = val;
      renderList();
    }

    // Render the main table
    function renderList() {
      const container = document.getElementById('activity-list');
      const empty = document.getElementById('empty-state');
      
      const filtered = activities.filter(a => 
        (a.category === currentCategory || !a.category) &&
        (!a.date || a.date === currentDate)
      );

      if (filtered.length === 0) {
        container.innerHTML = "";
        empty.classList.remove('hidden');
        empty.classList.add('flex');
        return;
      }

      empty.classList.add('hidden');
      empty.classList.remove('flex');

      container.innerHTML = filtered.map(item => `
        <div onclick="openEditItemModal('${item.id}')" class="flex items-center px-4 py-3.5 hover:bg-slate-50 active:bg-slate-100 transition cursor-pointer">
          <!-- Name & Time -->
          <div class="w-7/12 pr-2">
            <h3 class="text-[15px] font-normal text-slate-800 leading-snug">${escapeHtml(item.name)}</h3>
            <p class="text-xs text-slate-400 mt-1 font-sans">(${escapeHtml(item.timeRange || (item.startTime + ' - ' + item.endTime))})</p>
          </div>
          <!-- Count -->
          <div class="w-3/12 flex items-center justify-center space-x-1.5 text-slate-500 text-sm">
            <i class="fa-solid fa-user text-slate-400 text-xs"></i>
            <span class="font-medium text-slate-700">${item.present}/${item.total}</span>
          </div>
          <!-- Status & Chevron -->
          <div class="w-2/12 flex items-center justify-end space-x-2">
            <span class="${item.status === '已點名' ? 'text-emerald-600 font-normal' : 'text-slate-400'} text-sm whitespace-nowrap">
              ${escapeHtml(item.status || '已點名')}
            </span>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
          </div>
        </div>
      `).join('');
    }

    // Render Timeline Popup (每日課外活動)
    function openScheduleModal() {
      const modal = document.getElementById('schedule-modal');
      const timeline = document.getElementById('timeline-list');
      const dateLabel = document.getElementById('modal-date-label');
      
      dateLabel.textContent = currentDate;
      
      const dailyItems = activities.filter(a => !a.date || a.date === currentDate);
      
      if (dailyItems.length === 0) {
        timeline.innerHTML = `
          <div class="text-center py-10 text-slate-400 text-xs">
            本日無課外活動安排
          </div>
        `;
      } else {
        timeline.innerHTML = dailyItems.map(item => {
          const isClub = item.category === "學會" || !item.category;
          const barColor = isClub ? 'bg-[#009b9e]' : 'bg-amber-500';
          const dotColor = isClub ? 'bg-emerald-400 ring-emerald-100' : 'bg-amber-400 ring-amber-100';

          return `
            <div class="flex items-stretch space-x-3.5 relative">
              <!-- Timeline node -->
              <div class="flex flex-col items-center">
                <div class="w-3.5 h-3.5 rounded-full ${dotColor} ring-4 mt-4 z-10"></div>
                <div class="w-0.5 bg-slate-200 flex-1 -mt-1 -mb-1"></div>
              </div>

              <!-- Card Box -->
              <div class="flex-1 bg-white border border-slate-200/80 rounded-lg shadow-sm hover:shadow transition flex overflow-hidden">
                <div class="p-3.5 flex-1 flex flex-col justify-between">
                  <div class="flex items-baseline space-x-3">
                    <div class="text-xs text-slate-400 font-mono leading-tight whitespace-nowrap">
                      <div>${escapeHtml(item.startTime || '14:40')}</div>
                      <div>${escapeHtml(item.endTime || '15:40')}</div>
                    </div>
                    <div class="text-sm font-medium text-slate-800 leading-snug">
                      ${escapeHtml(item.name)}
                    </div>
                  </div>
                  <div class="flex items-center space-x-1.5 text-xs text-slate-400 mt-2 pl-9">
                    <i class="fa-solid fa-location-dot text-[11px] text-slate-400"></i>
                    <span>${escapeHtml(item.room || '課室')}</span>
                  </div>
                </div>
                <!-- Right status color indicator -->
                <div class="w-2 ${barColor} self-stretch"></div>
              </div>
            </div>
          `;
        }).join('');
      }

      modal.classList.remove('hidden');
    }

    function closeScheduleModal() {
      document.getElementById('schedule-modal').classList.add('hidden');
    }

    // PDF Import & Parsing Modal
    function openPdfModal() {
      document.getElementById('pdf-modal').classList.remove('hidden');
    }

    function closePdfModal() {
      document.getElementById('pdf-modal').classList.add('hidden');
      document.getElementById('pdf-status-text').textContent = '';
    }

    // Parse uploaded PDF with pdf.js
    async function handlePdfUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('pdf-status-text');
      statusEl.textContent = '讀取中... 請稍候';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          fullText += pageText + '\n';
        }

        document.getElementById('quick-text-input').value = fullText;
        statusEl.textContent = `成功讀取 ${pdf.numPages} 頁！已轉成文字，請確認後按匯入。`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'PDF 解析失敗，請確保為標準文字 PDF。';
      }
    }

    // Parse Quick Text area lines into activities
    async function parseQuickTextInput() {
      const text = document.getElementById('quick-text-input').value.trim();
      if (!text) {
        alert("請先貼上內容或上傳 PDF");
        return;
      }

      const selectedCat = document.querySelector('input[name="import-cat"]:checked')?.value || "學會";
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      const newItems = [];

      lines.forEach((line, idx) => {
        // Extract time patterns like (14:40 - 15:40) or 14:40-15:40
        let timeRange = "14:40 - 15:40";
        let startTime = "14:40";
        let endTime = "15:40";
        const timeMatch = line.match(/(\d{1,2}:\d{2})\s*[-~至到]\s*(\d{1,2}:\d{2})/);
        if (timeMatch) {
          startTime = timeMatch[1].padStart(5, '0');
          endTime = timeMatch[2].padStart(5, '0');
          timeRange = `${startTime} - ${endTime}`;
        }

        // Extract count patterns like 8/8 or 10人
        let present = 8, total = 8;
        const countMatch = line.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
        if (countMatch) {
          present = parseInt(countMatch[1]);
          total = parseInt(countMatch[2]);
        }

        // Extract room like 403 or 禮堂
        let room = "課室";
        const roomMatch = line.match(/(禮堂|大禮堂|操場|體育館|\d{3}[A-Za-z]?室?)/);
        if (roomMatch) {
          room = roomMatch[1];
        }

        // Clean name
        let name = line
          .replace(/\(?\d{1,2}:\d{2}\s*[-~至到]\s*\d{1,2}:\d{2}\)?/g, '')
          .replace(/\d{1,2}\s*\/\s*\d{1,2}/g, '')
          .replace(/(禮堂|大禮堂|操場|體育館|\d{3}[A-Za-z]?室?)/g, '')
          .trim();

        if (!name) name = `活動班別 ${idx + 1}`;

        newItems.push({
          id: 'custom-' + Date.now() + '-' + idx,
          date: currentDate,
          name: name,
          category: selectedCat,
          timeRange: timeRange,
          startTime: startTime,
          endTime: endTime,
          room: room,
          present: present,
          total: total,
          status: "已點名"
        });
      });

      activities = [...newItems, ...activities];
      await saveData();
      renderList();
      closePdfModal();
      alert(`已成功解析並新增 ${newItems.length} 個活動！`);
    }

    async function resetDefaultData() {
      activities = [...DEFAULT_DATA];
      await saveData();
      renderList();
      closePdfModal();
    }

    // Edit Item Modal Handlers
    function openEditItemModal(id) {
      const modal = document.getElementById('edit-item-modal');
      const title = document.getElementById('edit-modal-title');
      const deleteBtn = document.getElementById('delete-btn');

      if (id) {
        const item = activities.find(a => a.id === id);
        if (!item) return;
        title.textContent = "修改班別點名資料";
        deleteBtn.classList.remove('hidden');
        document.getElementById('item-id').value = item.id;
        document.getElementById('item-name').value = item.name;
        document.getElementById('item-start-time').value = item.startTime || "14:40";
        document.getElementById('item-end-time').value = item.endTime || "15:40";
        document.getElementById('item-room').value = item.room || "";
        document.getElementById('item-category').value = item.category || "學會";
        document.getElementById('item-present').value = item.present ?? 8;
        document.getElementById('item-total').value = item.total ?? 8;
        document.getElementById('item-status').value = item.status || "已點名";
      } else {
        title.textContent = "新增活動班別";
        deleteBtn.classList.add('hidden');
        document.getElementById('item-id').value = "";
        document.getElementById('item-name').value = "";
        document.getElementById('item-start-time').value = "14:40";
        document.getElementById('item-end-time').value = "15:40";
        document.getElementById('item-room').value = "403";
        document.getElementById('item-category').value = currentCategory;
        document.getElementById('item-present').value = 8;
        document.getElementById('item-total').value = 8;
        document.getElementById('item-status').value = "已點名";
      }

      modal.classList.remove('hidden');
    }

    function closeEditItemModal() {
      document.getElementById('edit-item-modal').classList.add('hidden');
    }

    async function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('item-id').value;
      const name = document.getElementById('item-name').value.trim();
      const startTime = document.getElementById('item-start-time').value;
      const endTime = document.getElementById('item-end-time').value;
      const room = document.getElementById('item-room').value.trim() || "未指定";
      const category = document.getElementById('item-category').value;
      const present = parseInt(document.getElementById('item-present').value) || 0;
      const total = parseInt(document.getElementById('item-total').value) || 0;
      const status = document.getElementById('item-status').value;

      if (id) {
        // Edit existing
        const idx = activities.findIndex(a => a.id === id);
        if (idx !== -1) {
          activities[idx] = {
            ...activities[idx],
            name,
            startTime,
            endTime,
            timeRange: `${startTime} - ${endTime}`,
            room,
            category,
            present,
            total,
            status
          };
        }
      } else {
        // Add new
        activities.unshift({
          id: 'act-' + Date.now(),
          date: currentDate,
          name,
          category,
          startTime,
          endTime,
          timeRange: `${startTime} - ${endTime}`,
          room,
          present,
          total,
          status
        });
      }

      await saveData();
      renderList();
      closeEditItemModal();
    }

    async function deleteCurrentItem() {
      const id = document.getElementById('item-id').value;
      if (!id) return;
      if (confirm("確定要刪除此活動記錄嗎？")) {
        activities = activities.filter(a => a.id !== id);
        await saveData();
        renderList();
        closeEditItemModal();
      }
    }

    // Toggle full-page views
    function togglePage(view) {
      const menuPage = document.getElementById('menu-page');
      if (view === 'menu') {
        menuPage.classList.remove('hidden');
      } else {
        menuPage.classList.add('hidden');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Run on load
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
